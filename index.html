<title>Pag-uli Bisaya</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700&family=Literata:opsz,wght@7..72,500;7..72,600&display=swap">
<style>
/* Layout: one narrow practice column — scene card on top, hints and answer unfold below, rating row at the bottom */
:root{
  --bg:#EEF3F1; --surface:#FFFFFF; --fg:#16262B; --muted:#5B6E70; --line:#D3DEDB;
  --accent:#0D7461; --accent-soft:#D7EDE6; --ok:#0D7461; --mid:#A86F10; --mid-soft:#F6E9CF; --ng:#A9402F; --ng-soft:#F5DCD6;
  --font-ui:"Zen Kaku Gothic New","Hiragino Sans","Yu Gothic",system-ui,sans-serif;
  --font-ceb:"Literata",Georgia,"Times New Roman",serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0F1A1C; --surface:#172427; --fg:#E4EEEC; --muted:#93A8A8; --line:#2A3B3E;
  --accent:#4CC3A6; --accent-soft:#163A33; --ok:#4CC3A6; --mid:#E3AE4F; --mid-soft:#3A2E16; --ng:#E8806C; --ng-soft:#3D211C; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0F1A1C; --surface:#172427; --fg:#E4EEEC; --muted:#93A8A8; --line:#2A3B3E;
  --accent:#4CC3A6; --accent-soft:#163A33; --ok:#4CC3A6; --mid:#E3AE4F; --mid-soft:#3A2E16; --ng:#E8806C; --ng-soft:#3D211C; color-scheme:dark}
html{background:var(--bg)}
body{background:var(--bg);color:var(--fg);font-family:var(--font-ui);font-size:16px;line-height:1.7;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 40px}
.wrap{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
header{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap}
h1{font-size:1.25rem;margin:0;letter-spacing:.02em;text-wrap:balance}
h1 small{display:block;font-size:.78rem;font-weight:400;color:var(--muted);letter-spacing:.04em}
nav{display:flex;gap:4px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:3px}
nav button{border:0;background:none;color:var(--muted);font:inherit;font-size:.85rem;padding:4px 14px;border-radius:999px;cursor:pointer}
nav button[aria-pressed="true"]{background:var(--accent);color:var(--surface)}
.stats{display:flex;gap:18px;font-size:.82rem;color:var(--muted);font-variant-numeric:tabular-nums;flex-wrap:wrap}
.stats b{color:var(--fg);font-weight:700}
.dots{display:flex;gap:6px}
.dots i{width:10px;height:10px;border-radius:50%;background:var(--line);display:block}
.dots i.done{background:var(--accent)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:22px 20px;display:flex;flex-direction:column;gap:16px}
.tag{font-size:.72rem;letter-spacing:.12em;color:var(--muted);text-transform:uppercase;display:flex;gap:10px;align-items:center}
.tag .kind{border-radius:999px;padding:0 9px;letter-spacing:.06em;font-size:.72rem}
.kind.new{background:var(--accent-soft);color:var(--accent)}
.kind.rev{background:var(--mid-soft);color:var(--mid)}
.scene{font-size:1.2rem;font-weight:500;margin:0;line-height:1.6;text-wrap:pretty}
.say{font-size:.85rem;color:var(--muted);margin:0}
.hints{display:flex;flex-direction:column;gap:8px}
.hint{font-size:.92rem;background:var(--bg);border-radius:8px;padding:8px 12px}
.hint span{color:var(--muted);font-size:.78rem;margin-right:8px}
.hint .first{font-family:var(--font-ceb);font-size:1.05rem}
.row{display:flex;gap:8px;flex-wrap:wrap}
button.btn{font:inherit;font-size:.92rem;border-radius:10px;padding:10px 16px;cursor:pointer;border:1px solid var(--line);background:var(--surface);color:var(--fg)}
button.btn:disabled{opacity:.45;cursor:default}
button.primary{background:var(--accent);border-color:var(--accent);color:var(--surface);font-weight:700}
button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.answer{border-top:1px dashed var(--line);padding-top:16px;display:flex;flex-direction:column;gap:12px}
.ceb{font-family:var(--font-ceb);font-size:1.6rem;font-weight:600;line-height:1.35;margin:0;text-wrap:balance}
.play{display:inline-flex;align-items:center;gap:8px}
.play svg{width:16px;height:16px;fill:currentColor}
.reps{display:flex;gap:8px;align-items:center;font-size:.85rem;color:var(--muted)}
.reps button{width:34px;height:34px;border-radius:50%;border:1.5px solid var(--line);background:var(--surface);color:var(--muted);font:inherit;font-weight:700;cursor:pointer}
.reps button.on{background:var(--accent);border-color:var(--accent);color:var(--surface)}
.rate{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.rate button{font:inherit;border-radius:10px;padding:10px 6px;cursor:pointer;border:1.5px solid;display:flex;flex-direction:column;align-items:center;line-height:1.3;background:var(--surface)}
.rate small{font-size:.72rem;opacity:.85}
.r-ok{color:var(--ok);border-color:var(--ok)!important}
.r-mid{color:var(--mid);border-color:var(--mid)!important}
.r-ng{color:var(--ng);border-color:var(--ng)!important}
.done-box{text-align:center;gap:10px;align-items:center}
.done-box h2{margin:0;font-size:1.15rem}
.note{font-size:.8rem;color:var(--muted)}
.list{display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.item{display:grid;grid-template-columns:2.2rem 1fr auto;gap:4px 10px;padding:12px 14px;border-top:1px solid var(--line);align-items:center}
.item:first-child{border-top:0}
.item .n{font-variant-numeric:tabular-nums;color:var(--muted);font-size:.8rem}
.item .t{min-width:0}
.item .t p{margin:0}
.item .s{font-size:.85rem}
.item .c{font-family:var(--font-ceb);font-size:1.05rem}
.item .st{font-size:.72rem;color:var(--muted)}
.icon-btn{width:38px;height:38px;border-radius:50%;border:1px solid var(--line);background:var(--surface);color:var(--accent);cursor:pointer;display:grid;place-items:center}
.icon-btn svg{width:15px;height:15px;fill:currentColor}
.foot{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;font-size:.78rem;color:var(--muted)}
.linkish{background:none;border:0;color:var(--muted);text-decoration:underline;font:inherit;cursor:pointer;padding:0}
@media (prefers-reduced-motion:no-preference){.answer,.hint{animation:in .25s ease-out}@keyframes in{from{opacity:.4;transform:translateY(4px)}}}
</style>

<div class="wrap">
  <header>
    <h1>Pag-uli Bisaya<small>妻の実家で使うセブアノ語 30文</small></h1>
    <nav aria-label="表示切り替え">
      <button id="tabPractice" aria-pressed="true">練習</button>
      <button id="tabList" aria-pressed="false">一覧</button>
    </nav>
  </header>

  <section id="practice" style="display:flex;flex-direction:column;gap:18px">
    <div class="stats" id="stats"></div>
    <div class="card" id="card"></div>
  </section>

  <section id="listView" hidden>
    <div class="list" id="list"></div>
  </section>

  <div class="foot">
    <span id="syncNote">記録を読み込み中</span>
    <button class="linkish" id="resetBtn">記録をリセット</button>
  </div>
</div>

<script>
const ITEMS = [
 {s:"夕方に家に着いた。義母にあいさつして、元気か聞く。", c:"Maayong hapon, Ma. Kumusta ka?", h:"あいさつ＋呼びかけ／様子を聞く"},
 {s:"義父に、また会えてうれしいと伝える。", c:"Nalipay ko nga nagkita ta pag-usab, Pa.", h:"うれしい＋nga＋〜したこと"},
 {s:"元気かと聞かれた。元気だと答えてお礼を言う。", c:"Maayo man ko, salamat.", h:"状態＋私＋お礼"},
 {s:"移動で疲れたけれど、大丈夫だと言う。", c:"Kapoy ang biyahe, pero okay ra ko.", h:"状態＋主語、でも〜"},
 {s:"義母にお土産を渡す。", c:"Ma, para nimo kini.", h:"〜のため＋あなた＋これ"},
 {s:"渡したお土産が日本からのものだと説明する。", c:"Pasalubong ni gikan sa Japan.", h:"名詞＋これ＋〜から"},
 {s:"義父に、体の調子はどうか気づかう。", c:"Pa, kumusta na ang imong panglawas?", h:"様子を聞く＋あなたの〜"},
 {s:"日本は今とても寒いと話す。", c:"Bugnaw kaayo karon sa Japan.", h:"状態＋とても＋今＋場所"},
 {s:"食卓の料理を見て、おいしそうと言う。", c:"Lami kaayo tan-awon!", h:"状態＋とても＋見た目"},
 {s:"食べてみて、義母においしいと伝える。", c:"Lami kaayo ni, Ma.", h:"状態＋とても＋これ"},
 {s:"知らない料理の名前を聞く。", c:"Unsa ni nga sud-an?", h:"何＋これ＋nga＋名詞"},
 {s:"ご飯のおかわりをお願いする。", c:"Mangayo pa ko og kan-on, palihug.", h:"動詞＋もっと＋私＋og＋名詞"},
 {s:"もうおなかがいっぱいだと言う。", c:"Busog na kaayo ko.", h:"状態＋もう＋とても＋私"},
 {s:"辛いものは苦手だと伝える。", c:"Dili ko ganahan og halang.", h:"否定＋私＋好き＋og＋名詞"},
 {s:"台所で、何か手伝えることはあるか聞く。", c:"Naa ba koy matabang?", h:"ある＋疑問＋私の〜"},
 {s:"食後、皿洗いは自分がやると申し出る。", c:"Ako na ang manghugas sa plato.", h:"私＋もう＋ang＋動詞"},
 {s:"温かく迎えてくれたことに、家族みんなへお礼を言う。", c:"Salamat sa pag-abiabi ninyo.", h:"お礼＋sa＋〜すること"},
 {s:"初めて会う姪に名前を聞く。", c:"Unsa imong ngalan?", h:"何＋あなたの〜"},
 {s:"姪に何歳か聞く。", c:"Pila na imong edad?", h:"いくつ＋もう＋あなたの〜"},
 {s:"親せきに、日本で米を作っていると話す。", c:"Nagtanom ko og humay sa Japan.", h:"動詞＋私＋og＋名詞＋場所"},
 {s:"セブアノ語を勉強していると話す。", c:"Nagtuon ko og Binisaya.", h:"動詞＋私＋og＋名詞"},
 {s:"セブアノ語はまだ少ししか話せないと言う。", c:"Gamay pa lang ang akong Binisaya.", h:"少し＋まだ＋だけ＋私の〜"},
 {s:"話が速いので、ゆっくり話してほしいと頼む。", c:"Hinay-hinay lang, palihug.", h:"様子＋だけ＋お願い"},
 {s:"話がわからなかったと伝える。", c:"Wala ko kasabot.", h:"否定＋私＋分かる"},
 {s:"もう一度言ってほしいと頼む。", c:"Usba daw, palihug.", h:"動詞＋daw＋お願い"},
 {s:"クリスマスのあいさつをする。", c:"Malipayong Pasko!", h:"楽しい＋行事名"},
 {s:"新年のあいさつをする。", c:"Malipayong Bag-ong Tuig!", h:"楽しい＋行事名"},
 {s:"眠くなったので、先に寝ると言う。", c:"Katulgon na ko. Matulog na ko.", h:"状態＋もう＋私／動詞＋もう＋私"},
 {s:"帰る日に、来年また来ると伝える。", c:"Mobalik ra mi sunod tuig.", h:"動詞＋ra＋私たち＋時"},
 {s:"別れ際に、義両親に体に気をつけてと言う。", c:"Amping kanunay, Ma ug Pa.", h:"動詞＋いつも＋呼びかけ"}
].map((x,i)=>({...x,id:i+1,audio:"audio/"+String(i+1).padStart(2,"0")+".mp3"}));

const DAILY = 5;
const LS_KEY = "paguli-bisaya-v1";
const PLAY = '<svg viewBox="0 0 16 16" aria-hidden="true"><path d="M4 2.5v11l9-5.5z"/></svg>';

function today(){const d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}
function addDays(n){const d=new Date();d.setDate(d.getDate()+n);return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}

let state = {cards:{}, day:{date:today(), count:0}};
let store = null; // {save(state)}

function normalize(s){
  if(!s||typeof s!=="object") return {cards:{},day:{date:today(),count:0}};
  const out={cards:{...(s.cards||{})},day:s.day&&s.day.date===today()?{...s.day}:{date:today(),count:0}};
  return out;
}
function lsLoad(){try{const r=localStorage.getItem(LS_KEY);return r?JSON.parse(r):null}catch(e){return null}}
function lsSave(s){try{localStorage.setItem(LS_KEY,JSON.stringify(s))}catch(e){}}

let saving=Promise.resolve();
function persist(){
  const snap=JSON.parse(JSON.stringify(state));
  lsSave(snap);
  if(store) saving=saving.then(()=>store.save(snap)).catch(()=>{document.getElementById("syncNote").textContent="記録の同期に失敗しました。この端末には保存されています"});
}

/* scheduling */
function schedule(id,rating){
  const c={...(state.cards[id]||{interval:0,reps:0})};
  if(rating==="ng"){c.interval=1}
  else if(rating==="mid"){c.interval=3}
  else {c.interval=c.reps>0&&c.last==="ok"?Math.round(Math.max(7,c.interval*2.5)):7}
  c.reps=(c.reps||0)+1; c.last=rating; c.due=addDays(c.interval);
  state.cards[id]=c;
}
function queue(){
  const t=today();
  const due=ITEMS.filter(x=>state.cards[x.id]&&state.cards[x.id].due<=t)
    .sort((a,b)=>state.cards[a.id].due.localeCompare(state.cards[b.id].due)||a.id-b.id);
  const fresh=ITEMS.filter(x=>!state.cards[x.id]);
  return due.concat(fresh);
}

/* audio */
const player=new Audio();
function play(src){try{player.pause();player.src=src;player.currentTime=0;player.play().catch(()=>{})}catch(e){}}

/* practice view */
let current=null, hintLevel=0, revealed=false, extra=0;
function pick(){const q=queue();current=q[0]||null;hintLevel=0;revealed=false}

function renderStats(){
  const t=today(); const seen=Object.keys(state.cards).length;
  const dueN=ITEMS.filter(x=>state.cards[x.id]&&state.cards[x.id].due<=t).length;
  const limit=DAILY+extra;
  let dots='';for(let i=0;i<limit;i++)dots+=`<i class="${i<state.day.count?'done':''}"></i>`;
  document.getElementById("stats").innerHTML=
    `<span>今日 <b>${Math.min(state.day.count,limit)}</b> / ${limit}</span><span class="dots" aria-hidden="true">${dots}</span><span>復習待ち <b>${dueN}</b></span><span>学習済み <b>${seen}</b> / ${ITEMS.length}</span>`;
}

function renderCard(){
  renderStats();
  const el=document.getElementById("card");
  const limit=DAILY+extra;
  if(state.day.count>=limit||!current){
    const left=queue().length;
    el.className="card done-box";
    el.innerHTML = !current
      ? `<h2>今日の分はすべて終わりました</h2><p class="note">新しい文も復習待ちもありません。明日また開いてください。</p>`
      : `<h2>今日の${limit}問が終わりました</h2><p class="note">言えなかった文は明日、詰まった文は3日後にまた出ます。</p>`+
        (left?`<div class="row" style="justify-content:center"><button class="btn" id="moreBtn">あと5問やる</button></div>`:"");
    const m=document.getElementById("moreBtn"); if(m) m.onclick=()=>{extra+=5;pick();renderCard()};
    return;
  }
  const isNew=!state.cards[current.id];
  const first=current.c.split(/[\s,]+/)[0];
  let hints="";
  if(hintLevel>=1) hints+=`<div class="hint"><span>文型</span>${current.h}</div>`;
  if(hintLevel>=2) hints+=`<div class="hint"><span>最初の単語</span><span class="first">${first} …</span></div>`;
  el.className="card";
  el.innerHTML=`
    <div class="tag">No. ${String(current.id).padStart(2,"0")}<span class="kind ${isNew?'new':'rev'}">${isNew?'新しい文':'復習'}</span></div>
    <p class="scene">${current.s}</p>
    <p class="say">セブアノ語で声に出して言ってから、答えを見てください。</p>
    ${hints?`<div class="hints">${hints}</div>`:""}
    ${revealed?`
    <div class="answer">
      <p class="ceb" lang="ceb">${current.c}</p>
      <div class="row"><button class="btn play" id="playBtn">${PLAY}音声をもう一度</button></div>
      <div class="reps" id="reps">音声のあとに3回音読
        <button aria-label="1回目">1</button><button aria-label="2回目">2</button><button aria-label="3回目">3</button></div>
      <div class="rate">
        <button class="r-ok" data-r="ok">言えた<small>次は1週間後〜</small></button>
        <button class="r-mid" data-r="mid">詰まった<small>3日後</small></button>
        <button class="r-ng" data-r="ng">言えなかった<small>明日</small></button>
      </div>
    </div>`:`
    <div class="row">
      <button class="btn" id="hintBtn" ${hintLevel>=2?"disabled":""}>${hintLevel===0?"ヒント：文型":hintLevel===1?"ヒント：最初の単語":"ヒントはここまで"}</button>
      <button class="btn primary" id="revealBtn">答えと音声</button>
    </div>`}`;
  if(!revealed){
    document.getElementById("hintBtn").onclick=()=>{hintLevel++;renderCard()};
    document.getElementById("revealBtn").onclick=()=>{revealed=true;renderCard();play(current.audio)};
  }else{
    document.getElementById("playBtn").onclick=()=>play(current.audio);
    document.querySelectorAll("#reps button").forEach(b=>b.onclick=()=>b.classList.toggle("on"));
    el.querySelectorAll(".rate button").forEach(b=>b.onclick=()=>{
      schedule(current.id,b.dataset.r); state.day.count++; persist(); pick(); renderCard();
    });
  }
}

/* list view */
function renderList(){
  const t=today();
  document.getElementById("list").innerHTML=ITEMS.map(x=>{
    const c=state.cards[x.id];
    const st=!c?"未学習":c.due<=t?"今日復習":"次回 "+c.due.slice(5).replace("-","/");
    return `<div class="item"><span class="n">${String(x.id).padStart(2,"0")}</span>
      <div class="t"><p class="s">${x.s}</p><p class="c" lang="ceb">${x.c}</p><p class="st">${st}</p></div>
      <button class="icon-btn" data-a="${x.audio}" aria-label="No.${x.id} の音声を再生">${PLAY}</button></div>`;
  }).join("");
  document.querySelectorAll("#list .icon-btn").forEach(b=>b.onclick=()=>play(b.dataset.a));
}

function show(tab){
  const p=tab==="practice";
  document.getElementById("practice").hidden=!p; document.getElementById("practice").style.display=p?"flex":"none";
  document.getElementById("listView").hidden=p;
  document.getElementById("tabPractice").setAttribute("aria-pressed",String(p));
  document.getElementById("tabList").setAttribute("aria-pressed",String(!p));
  if(!p) renderList();
}
document.getElementById("tabPractice").onclick=()=>show("practice");
document.getElementById("tabList").onclick=()=>show("list");

let resetArmed=false;
document.getElementById("resetBtn").onclick=e=>{
  if(!resetArmed){resetArmed=true;e.target.textContent="本当にリセットする（もう一度押す）";setTimeout(()=>{resetArmed=false;e.target.textContent="記録をリセット"},4000);return}
  resetArmed=false;e.target.textContent="記録をリセット";
  state={cards:{},day:{date:today(),count:0}};extra=0;persist();pick();renderCard();renderList();
};

/* boot: local first, then cloud */
state=normalize(lsLoad()); pick(); renderCard();
document.getElementById("syncNote").textContent="記録はこの端末に保存されます";

(async()=>{
  try{
    if(!window.claude||!window.claude.use) return;
    const [db,user]=await Promise.all([claude.use("db"),claude.use("user")]);
    if(!db||!user) return;
    const id=await user.id(); if(!id) return;
    const ref=db.doc("data/users/"+id+"/progress");
    const snap=await Promise.race([ref.get(),new Promise((_,r)=>setTimeout(()=>r(new Error("timeout")),10000))]);
    if(snap.exists){
      const remote=normalize(snap.data());
      // keep whichever has more learning history
      if(Object.keys(remote.cards).length>=Object.keys(state.cards).length){state=remote;lsSave(state)}
    }
    store={save:s=>ref.set(s)};
    if(!snap.exists && Object.keys(state.cards).length) persist();
    document.getElementById("syncNote").textContent="記録はスマホとパソコンで共有されます";
    pick(); renderCard(); if(!document.getElementById("listView").hidden) renderList();
  }catch(e){document.getElementById("syncNote").textContent="記録はこの端末に保存されます"}
})();
</script>
