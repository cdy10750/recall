<title>Speak with Your Loved Ones</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Zen+Kaku+Gothic+New:wght@400;500;700&family=Literata:opsz,wght@7..72,500;7..72,600&display=swap">
<style>
/* Layout: one narrow practice column. Course picker first; then scene card on top, hints and answer unfold below, rating row at the bottom */
:root{
  --bg:#EEF3F1; --surface:#FFFFFF; --fg:#16262B; --muted:#5B6E70; --line:#D3DEDB;
  --accent:#0D7461; --accent-soft:#D7EDE6; --ok:#0D7461; --mid:#A86F10; --mid-soft:#F6E9CF; --ng:#A9402F; --ng-soft:#F5DCD6;
  --font-ui:"Atkinson Hyperlegible","Segoe UI",system-ui,sans-serif;
  --font-ceb:"Literata",Georgia,"Times New Roman",serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0F1A1C; --surface:#172427; --fg:#E4EEEC; --muted:#93A8A8; --line:#2A3B3E;
  --accent:#4CC3A6; --accent-soft:#163A33; --ok:#4CC3A6; --mid:#E3AE4F; --mid-soft:#3A2E16; --ng:#E8806C; --ng-soft:#3D211C; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0F1A1C; --surface:#172427; --fg:#E4EEEC; --muted:#93A8A8; --line:#2A3B3E;
  --accent:#4CC3A6; --accent-soft:#163A33; --ok:#4CC3A6; --mid:#E3AE4F; --mid-soft:#3A2E16; --ng:#E8806C; --ng-soft:#3D211C; color-scheme:dark}
html{background:var(--bg)}
body{background:var(--bg);color:var(--fg);font-family:var(--font-ui);font-size:16px;line-height:1.6;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 40px}
.wrap{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
header{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap}
h1{font-size:1.3rem;margin:0;letter-spacing:.01em;text-wrap:balance}
h1 small{display:block;font-size:.8rem;font-weight:400;color:var(--muted);letter-spacing:.02em}
nav{display:flex;gap:4px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:3px}
nav button{border:0;background:none;color:var(--muted);font:inherit;font-size:.85rem;padding:4px 14px;border-radius:999px;cursor:pointer}
nav button[aria-pressed="true"]{background:var(--accent);color:var(--surface)}
.stats{display:flex;gap:18px;font-size:.82rem;color:var(--muted);font-variant-numeric:tabular-nums;flex-wrap:wrap;align-items:center}
.stats b{color:var(--fg);font-weight:700}
.dots{display:flex;gap:6px}
.dots i{width:10px;height:10px;border-radius:50%;background:var(--line);display:block}
.dots i.done{background:var(--accent)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:22px 20px;display:flex;flex-direction:column;gap:16px}
.tag{font-size:.74rem;letter-spacing:.1em;color:var(--muted);text-transform:uppercase;display:flex;gap:10px;align-items:center}
.pill{border-radius:999px;padding:0 9px;letter-spacing:.05em;font-size:.72rem;text-transform:uppercase}
.pill.new{background:var(--accent-soft);color:var(--accent)}
.pill.rev{background:var(--mid-soft);color:var(--mid)}
.pill.draft{background:var(--ng-soft);color:var(--ng)}
.scene{font-size:1.2rem;font-weight:700;margin:0;line-height:1.5;text-wrap:pretty}
.say{font-size:.88rem;color:var(--muted);margin:0}
.hints{display:flex;flex-direction:column;gap:8px}
.hint{font-size:.95rem;background:var(--bg);border-radius:8px;padding:8px 12px}
.hint span{color:var(--muted);font-size:.78rem;margin-right:8px;text-transform:uppercase;letter-spacing:.06em}
.hint .first{font-family:var(--font-ceb);font-size:1.05rem;text-transform:none;letter-spacing:0;color:var(--fg)}
.row{display:flex;gap:8px;flex-wrap:wrap}
button.btn{font:inherit;font-size:.95rem;border-radius:10px;padding:10px 16px;cursor:pointer;border:1px solid var(--line);background:var(--surface);color:var(--fg)}
button.btn:disabled{opacity:.45;cursor:default}
button.primary{background:var(--accent);border-color:var(--accent);color:var(--surface);font-weight:700}
button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.answer{border-top:1px dashed var(--line);padding-top:16px;display:flex;flex-direction:column;gap:12px}
.ceb{font-family:var(--font-ceb);font-size:1.6rem;font-weight:600;line-height:1.35;margin:0;text-wrap:balance}
.play{display:inline-flex;align-items:center;gap:8px}
.play svg{width:16px;height:16px;fill:currentColor}
.reps{display:flex;gap:8px;align-items:center;font-size:.88rem;color:var(--muted);flex-wrap:wrap}
.reps button{width:34px;height:34px;border-radius:50%;border:1.5px solid var(--line);background:var(--surface);color:var(--muted);font:inherit;font-weight:700;cursor:pointer}
.reps button.on{background:var(--accent);border-color:var(--accent);color:var(--surface)}
.rate{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.rate button{font:inherit;font-size:.92rem;border-radius:10px;padding:10px 6px;cursor:pointer;border:1.5px solid;display:flex;flex-direction:column;align-items:center;line-height:1.3;background:var(--surface);text-align:center}
.rate small{font-size:.74rem;opacity:.85}
.r-ok{color:var(--ok);border-color:var(--ok)!important}
.r-mid{color:var(--mid);border-color:var(--mid)!important}
.r-ng{color:var(--ng);border-color:var(--ng)!important}
.done-box{text-align:center;gap:10px;align-items:center}
.done-box h2{margin:0;font-size:1.15rem}
.note{font-size:.84rem;color:var(--muted);margin:0}
/* course picker */
.intro{display:flex;flex-direction:column;gap:6px}
.intro h2{margin:0;font-size:1.15rem;text-wrap:balance}
.courses{display:flex;flex-direction:column;gap:10px}
.course{font:inherit;color:var(--fg);text-align:left;background:var(--surface);border:1.5px solid var(--line);border-radius:14px;padding:16px 18px;cursor:pointer;display:grid;grid-template-columns:1fr auto;gap:4px 12px;align-items:center}
.course:hover{border-color:var(--accent)}
.course.current{border-color:var(--accent);background:var(--accent-soft)}
.course b{font-size:1.05rem}
.course p{margin:0;font-size:.9rem;color:var(--muted);grid-column:1}
.course .who{font-family:var(--font-ceb);font-size:.95rem;color:var(--accent);grid-column:2;grid-row:1 / span 2;white-space:nowrap}
/* list */
.list{display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.item{display:grid;grid-template-columns:1fr auto;gap:4px 10px;padding:12px 14px;border-top:1px solid var(--line);align-items:center}
.item:first-child{border-top:0}
.item .t{min-width:0;display:flex;flex-direction:column;gap:2px}
.item .t p{margin:0}
.item .s{font-size:.88rem}
.item .c{font-family:var(--font-ceb);font-size:1.05rem}
.item .st{font-size:.74rem;color:var(--muted);display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.icon-btn{width:38px;height:38px;border-radius:50%;border:1px solid var(--line);background:var(--surface);color:var(--accent);cursor:pointer;display:grid;place-items:center}
.icon-btn svg{width:15px;height:15px;fill:currentColor}
.foot{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;font-size:.8rem;color:var(--muted)}
.linkish{background:none;border:0;color:var(--muted);text-decoration:underline;font:inherit;cursor:pointer;padding:0}
@media (prefers-reduced-motion:no-preference){.answer,.hint{animation:in .25s ease-out}@keyframes in{from{opacity:.4;transform:translateY(4px)}}}
/* Japanese UI */
:root[lang="ja"]{--font-ui:"Zen Kaku Gothic New","Hiragino Sans","Yu Gothic",system-ui,sans-serif}
:root[lang="ja"] body{line-height:1.7}
:root[lang="ja"] .scene{font-weight:500}
:root[lang="ja"] .hint span,:root[lang="ja"] .pill,:root[lang="ja"] .tag{text-transform:none;letter-spacing:.04em}
#langNav button{padding:4px 12px}
.filter{display:flex;gap:10px;align-items:center;flex-wrap:wrap;font-size:.85rem;color:var(--muted)}
.filter select{font:inherit;font-size:.92rem;color:var(--fg);background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:7px 10px;max-width:100%}
.filter select:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.cat-h{display:flex;justify-content:space-between;gap:10px;padding:10px 14px;background:var(--bg);border-top:1px solid var(--line);font-size:.8rem;font-weight:700;color:var(--muted);letter-spacing:.04em}
.cat-h:first-child{border-top:0}
.cat-h + .item{border-top:0}
</style>
<div class="wrap">
  <header>
    <h1 id="appName">Speak with Your Loved Ones<small id="courseName"></small></h1>
    <div class="row" style="align-items:center">
      <nav aria-label="Language" id="langNav">
        <button id="langEn" lang="en" aria-pressed="false">English</button>
        <button id="langJa" lang="ja" aria-pressed="false">日本語</button>
      </nav>
      <nav id="nav" hidden>
        <button id="tabPractice" aria-pressed="true"></button>
        <button id="tabList" aria-pressed="false"></button>
      </nav>
    </div>
  </header>

  <section id="picker" hidden>
    <div class="card">
      <div class="intro">
        <h2 id="pickTitle"></h2>
        <p class="note" id="pickNote"></p>
      </div>
      <div class="courses" id="courses"></div>
    </div>
  </section>

  <section id="practice" hidden>
    <div style="display:flex;flex-direction:column;gap:18px">
      <div class="filter"><label for="catSel" id="catLbl"></label><select id="catSel"></select></div>
      <div class="stats" id="stats"></div>
      <div class="card" id="card"></div>
    </div>
  </section>

  <section id="listView" hidden>
    <div class="list" id="list"></div>
  </section>

  <div class="foot">
    <span id="footNote"></span>
    <span class="row" style="gap:14px">
      <button class="linkish" id="changeBtn" hidden></button>
      <button class="linkish" id="resetBtn" hidden></button>
    </span>
  </div>
</div>

<script>
/* Sentences: c = Cebuano answer; en / ja = scene and pattern hint per UI language.
   audio:null marks a sentence still waiting for a native-speaker check (shown in the list only). */
const S = {
 "03":{"c": "Maayo man ko, salamat.", "en": {"s": "Someone asks how you are. Say you're fine, and thank them.", "h": "state + I + thanks"}, "ja": {"s": "元気かと聞かれた。元気だと答えてお礼を言う。", "h": "状態＋私＋お礼"}},
 "04":{"c": "Kapoy ang biyahe, pero okay ra ko.", "en": {"s": "You've just arrived after a long trip. Say the trip was tiring, but you're okay.", "h": "state + subject, but …"}, "ja": {"s": "長旅のあと、着いたところ。移動で疲れたけれど、大丈夫だと言う。", "h": "状態＋主語、でも〜"}},
 "09":{"c": "Lami kaayo tan-awon!", "en": {"s": "The food is on the table. Say it looks delicious.", "h": "state + very + to look at"}, "ja": {"s": "食卓の料理を見て、おいしそうと言う。", "h": "状態＋とても＋見た目"}},
 "11":{"c": "Unsa ni nga sud-an?", "en": {"s": "There's a dish you don't recognize. Ask what it is.", "h": "what + this + nga + noun"}, "ja": {"s": "知らない料理の名前を聞く。", "h": "何＋これ＋nga＋名詞"}},
 "12":{"c": "Mangayo pa ko og kan-on, palihug.", "en": {"s": "Ask for another serving of rice.", "h": "verb + more + I + og + noun"}, "ja": {"s": "ご飯のおかわりをお願いする。", "h": "動詞＋もっと＋私＋og＋名詞"}},
 "13":{"c": "Busog na kaayo ko.", "en": {"s": "Say you're already full.", "h": "state + already + very + I"}, "ja": {"s": "もうおなかがいっぱいだと言う。", "h": "状態＋もう＋とても＋私"}},
 "14":{"c": "Dili ko ganahan og halang.", "en": {"s": "Say you don't like spicy food.", "h": "not + I + like + og + noun"}, "ja": {"s": "辛いものは苦手だと伝える。", "h": "否定＋私＋好き＋og＋名詞"}},
 "15":{"c": "Naa ba koy matabang?", "en": {"s": "In the kitchen, ask if there's anything you can help with.", "h": "there is + question + my …"}, "ja": {"s": "台所で、何か手伝えることはあるか聞く。", "h": "ある＋疑問＋私の〜"}},
 "18":{"c": "Unsa imong ngalan?", "en": {"s": "You meet a child for the first time. Ask their name.", "h": "what + your …"}, "ja": {"s": "初めて会う子どもに名前を聞く。", "h": "何＋あなたの〜"}},
 "19":{"c": "Pila na imong edad?", "en": {"s": "Ask the child how old they are.", "h": "how many + already + your …"}, "ja": {"s": "その子に何歳か聞く。", "h": "いくつ＋もう＋あなたの〜"}},
 "21":{"c": "Nagtuon ko og Binisaya.", "en": {"s": "Say you're studying Cebuano.", "h": "verb + I + og + noun"}, "ja": {"s": "セブアノ語を勉強していると話す。", "h": "動詞＋私＋og＋名詞"}},
 "22":{"c": "Gamay pa lang ang akong Binisaya.", "en": {"s": "Say your Cebuano is still only a little.", "h": "a little + still + only + my …"}, "ja": {"s": "セブアノ語はまだ少ししか話せないと言う。", "h": "少し＋まだ＋だけ＋私の〜"}},
 "23":{"c": "Hinay-hinay lang, palihug.", "en": {"s": "People are talking fast. Ask them to slow down.", "h": "manner + only + please"}, "ja": {"s": "話が速いので、ゆっくり話してほしいと頼む。", "h": "様子＋だけ＋お願い"}},
 "24":{"c": "Wala ko kasabot.", "en": {"s": "Say you didn't understand.", "h": "not + I + understand"}, "ja": {"s": "話がわからなかったと伝える。", "h": "否定＋私＋分かる"}},
 "25":{"c": "Usba daw, palihug.", "en": {"s": "Ask them to say it again.", "h": "verb + daw + please"}, "ja": {"s": "もう一度言ってほしいと頼む。", "h": "動詞＋daw＋お願い"}},
 "26":{"c": "Malipayong Pasko!", "en": {"s": "Wish everyone a merry Christmas.", "h": "happy + occasion"}, "ja": {"s": "クリスマスのあいさつをする。", "h": "楽しい＋行事名"}},
 "27":{"c": "Malipayong Bag-ong Tuig!", "en": {"s": "Wish everyone a happy New Year.", "h": "happy + occasion"}, "ja": {"s": "新年のあいさつをする。", "h": "楽しい＋行事名"}},
 "28":{"c": "Katulgon na ko. Matulog na ko.", "en": {"s": "You're getting sleepy. Say you're going to bed.", "h": "state + already + I / verb + already + I"}, "ja": {"s": "眠くなったので、先に寝ると言う。", "h": "状態＋もう＋私／動詞＋もう＋私"}},
 "01":{"c": "Maayong hapon, Ma. Kumusta ka?", "en": {"s": "You arrive at your partner's family home in the afternoon. Greet your mother-in-law and ask how she is.", "h": "greeting + name / ask how"}, "ja": {"s": "午後、パートナーの実家に着いた。義母にあいさつして、元気か聞く。", "h": "あいさつ＋呼びかけ／様子を聞く"}},
 "02":{"c": "Nalipay ko nga nagkita ta pag-usab, Pa.", "en": {"s": "Tell your father-in-law you're happy to see him again.", "h": "happy + nga + what happened"}, "ja": {"s": "義父に、また会えてうれしいと伝える。", "h": "うれしい＋nga＋〜したこと"}},
 "05":{"c": "Ma, para nimo kini.", "en": {"s": "Give your mother-in-law the gift you brought.", "h": "for + you + this"}, "ja": {"s": "義母にお土産を渡す。", "h": "〜のため＋あなた＋これ"}},
 "07":{"c": "Pa, kumusta na ang imong panglawas?", "en": {"s": "Ask your father-in-law how his health is.", "h": "ask how + your …"}, "ja": {"s": "義父に、体の調子はどうか気づかう。", "h": "様子を聞く＋あなたの〜"}},
 "10":{"c": "Lami kaayo ni, Ma.", "en": {"s": "You taste the food. Tell your mother-in-law it's delicious.", "h": "state + very + this"}, "ja": {"s": "食べてみて、義母においしいと伝える。", "h": "状態＋とても＋これ"}},
 "16":{"c": "Ako na ang manghugas sa plato.", "en": {"s": "After the meal, offer to wash the dishes yourself.", "h": "me + already + ang + verb"}, "ja": {"s": "食後、皿洗いは自分がやると申し出る。", "h": "私＋もう＋ang＋動詞"}},
 "17":{"c": "Salamat sa pag-abiabi ninyo.", "en": {"s": "Thank the whole family for welcoming you so warmly.", "h": "thanks + sa + the act of …"}, "ja": {"s": "温かく迎えてくれたことに、家族みんなへお礼を言う。", "h": "お礼＋sa＋〜すること"}},
 "29":{"c": "Mobalik ra mi sunod tuig.", "en": {"s": "On the day you leave, say that you and your family will come back next year.", "h": "verb + ra + we + time"}, "ja": {"s": "帰る日に、来年また家族で来ると伝える。", "h": "動詞＋ra＋私たち＋時"}},
 "30":{"c": "Amping kanunay, Ma ug Pa.", "en": {"s": "As you say goodbye, tell your parents-in-law to take care.", "h": "verb + always + names"}, "ja": {"s": "別れ際に、義両親に体に気をつけてと言う。", "h": "動詞＋いつも＋呼びかけ"}},
 "g06":{"c": "Pasalubong ni gikan sa abroad.", "en": {"s": "Explain that the gift is pasalubong you brought from abroad.", "h": "noun + this + from …"}, "ja": {"s": "渡したお土産が、外国から持ってきたものだと説明する。", "h": "名詞＋これ＋〜から"}},
 "b01":{"c": "Maayong hapon, Lola. Kumusta ka?", "en": {"s": "You arrive at your grandparents' house in the afternoon. Greet your grandmother and ask how she is.", "h": "greeting + name / ask how"}},
 "b02":{"c": "Nalipay ko nga nagkita ta pag-usab, Lolo.", "en": {"s": "Tell your grandfather you're happy to see him again.", "h": "happy + nga + what happened"}},
 "b05":{"c": "Lola, para nimo kini.", "en": {"s": "Give your grandmother the gift you brought.", "h": "for + you + this"}},
 "b07":{"c": "Lolo, kumusta na ang imong panglawas?", "en": {"s": "Ask your grandfather how his health is.", "h": "ask how + your …"}},
 "b10":{"c": "Lami kaayo ni, Lola.", "en": {"s": "You taste the food. Tell your grandmother it's delicious.", "h": "state + very + this"}},
 "b11":{"c": "Gimingaw ko ninyo.", "en": {"s": "You haven't seen your relatives in years. Tell them you missed them.", "h": "miss + I + you all"}},
 "b12":{"c": "Asa man si Tito?", "en": {"s": "Your uncle isn't at the gathering. Ask where he is.", "h": "where + man + si + name"}},
 "b30":{"c": "Amping kanunay, Lola ug Lolo.", "en": {"s": "As you say goodbye, tell your grandparents to take care.", "h": "verb + always + names"}},
 "c01":{"c": "Maayong buntag! Asa ka padulong?", "en": {"s": "In the morning you pass a neighbor. Greet them and ask where they're headed.", "h": "greeting / where + you + headed"}, "ja": {"s": "朝、近所の人とすれ違った。あいさつして、どこへ行くのか聞く。", "h": "あいさつ／どこ＋あなた＋向かう"}},
 "c02":{"c": "Nikaon na ka?", "en": {"s": "A neighbor drops by around lunchtime. Ask if they've eaten.", "h": "verb (done) + already + you"}, "ja": {"s": "昼ごろ、近所の人が来た。もうご飯を食べたか聞く。", "h": "動詞（済んだこと）＋もう＋あなた"}},
 "c03":{"c": "Init kaayo karon, no?", "en": {"s": "Make small talk. Say it's really hot today.", "h": "state + very + now, no?"}, "ja": {"s": "世間話で、今日はすごく暑いねと言う。", "h": "状態＋とても＋今、ね？"}},
 "c04":{"c": "Murag mag-ulan.", "en": {"s": "Dark clouds are rolling in. Say it looks like rain.", "h": "seems + verb"}, "ja": {"s": "黒い雲が近づいてきた。雨が降りそうだと言う。", "h": "〜みたい＋動詞"}},
 "c05":{"c": "Taga-asa ka?", "en": {"s": "Ask someone you've just met where they're from.", "h": "from where + you"}, "ja": {"s": "知り合ったばかりの人に、どこの出身か聞く。", "h": "どこの出身＋あなた"}},
 "c06":{"c": "Asa ka nagpuyo?", "en": {"s": "Ask a neighbor where they live.", "h": "where + you + verb"}, "ja": {"s": "近所の人に、どこに住んでいるか聞く。", "h": "どこ＋あなた＋動詞"}},
 "c07":{"c": "Bag-o ra mi diri.", "en": {"s": "Tell a neighbor that you and your family are new here.", "h": "new + ra + we + here"}, "ja": {"s": "近所の人に、自分たち家族はここに来たばかりだと伝える。", "h": "新しい＋ra＋私たち＋ここ"}},
 "c08":{"c": "Pila ni?", "en": {"s": "At the market, ask how much something costs.", "h": "how much + this"}, "ja": {"s": "市場で、値段を聞く。", "h": "いくら＋これ"}},
 "c09":{"c": "Usa ka kilo nga bugas, palihug.", "en": {"s": "At the store, ask for one kilo of rice.", "h": "number + ka + unit + nga + noun, please"}, "ja": {"s": "店で、米を1キロ頼む。", "h": "数＋ka＋単位＋nga＋名詞、お願い"}},
 "c10":{"c": "Wala na bay hangyo?", "en": {"s": "The price seems high. Ask if they can lower it.", "h": "none + already + question + discount"}, "ja": {"s": "値段が高い。まけてもらえないか聞く。", "h": "ない＋もう＋疑問＋値引き"}},
 "c11":{"c": "Lugar lang, palihug.", "en": {"s": "You're on a jeepney. Ask the driver to stop here.", "h": "place + only + please"}, "ja": {"s": "ジプニーで、ここで降りると運転手に伝える。", "h": "場所＋だけ＋お願い"}},
 "c12":{"c": "Sige, magkita ra ta unya.", "en": {"s": "Say goodbye. Tell them you'll see them later.", "h": "okay, verb + ra + we + later"}, "ja": {"s": "別れ際に、じゃあまたあとでと言う。", "h": "じゃあ、動詞＋ra＋私たち＋あとで"}},
 "s01":{"c": "Nalipay ko nga nakaila nimo.", "en": {"s": "You meet a relative for the first time. Say you're glad to meet them.", "h": "happy + nga + what happened"}, "ja": {"s": "初めて会った親せきに、会えてうれしいと言う。", "h": "うれしい＋nga＋〜したこと"}},
 "s02":{"c": "Unang higayon nako diri.", "en": {"s": "Say it's your first time here.", "h": "first time + my + here"}, "ja": {"s": "ここに来るのは初めてだと言う。", "h": "初めて＋私の＋ここ"}},
 "s03":{"c": "Ganahan kaayo ko diri.", "en": {"s": "Someone asks if you like it here. Say you like it a lot.", "h": "like + very + I + here"}, "ja": {"s": "ここは気に入ったかと聞かれた。とても気に入ったと答える。", "h": "好き＋とても＋私＋ここ"}},
 "s04":{"c": "Nagpuyo mi sa abroad.", "en": {"s": "Someone asks where you live. Say you and your family live abroad.", "h": "verb + we + place"}, "ja": {"s": "どこに住んでいるのか聞かれた。家族で外国に住んでいると答える。", "h": "動詞＋私たち＋場所"}},
 "s05":{"c": "Wala pa mi anak.", "en": {"s": "Someone asks if you have children. Say not yet.", "h": "none + yet + we + noun"}, "ja": {"s": "子どもはいるのかと聞かれた。まだいないと答える。", "h": "ない＋まだ＋私たち＋名詞"}},
 "s06":{"c": "Gitudloan ko niya og Binisaya.", "en": {"s": "Say your partner is teaching you Cebuano.", "h": "verb (be taught) + I + by them + og + noun"}, "ja": {"s": "パートナーにセブアノ語を教えてもらっていると話す。", "h": "動詞（〜してもらう）＋私＋その人＋og＋名詞"}},
 "s07":{"c": "Natawo ko sa abroad.", "en": {"s": "Say you were born abroad.", "h": "verb + I + place"}, "ja": {"s": "自分は外国で生まれたと話す。", "h": "動詞＋私＋場所"}},
 "s08":{"c": "Bisaya akong mama.", "en": {"s": "Say your mother is Visayan.", "h": "noun + my …"}, "ja": {"s": "母がビサヤの人だと話す。", "h": "名詞＋私の〜"}},
 "f01":{"c": "Kumusta na ang tanan diri?", "en": {"s": "Ask how everyone here is doing.", "h": "ask how + everyone + here"}, "ja": {"s": "着いてすぐ、家のみんなは元気か聞く。", "h": "様子を聞く＋みんな＋ここ"}},
 "f02":{"c": "Pila na ang imong mga apo?", "en": {"s": "Ask your mother-in-law how many grandchildren she has now.", "h": "how many + now + your + plural + noun"}, "ja": {"s": "義母に、孫は何人になったか聞く。", "h": "いくつ＋もう＋あなたの＋複数＋名詞"}},
 "f03":{"c": "Nagdako na kaayo ka!", "en": {"s": "You see a child you haven't seen in a while. Say they've grown so much.", "h": "verb + already + very + you"}, "ja": {"s": "久しぶりに会った子どもに、大きくなったねと言う。", "h": "動詞＋もう＋とても＋あなた"}},
 "f04":{"c": "Asa na nag-eskwela ang imong anak?", "en": {"s": "Ask a relative where their child goes to school now.", "h": "where + now + verb + your …"}, "ja": {"s": "親せきに、子どもは今どこの学校に通っているか聞く。", "h": "どこ＋今＋動詞＋あなたの〜"}},
 "f05":{"c": "Minyo na ka?", "en": {"s": "Ask a cousin if they're married yet.", "h": "state + already + you"}, "ja": {"s": "いとこに、もう結婚しているか聞く。", "h": "状態＋もう＋あなた"}},
 "f06":{"c": "Kinsa ni siya?", "en": {"s": "Someone shows you a photo. Ask who this is.", "h": "who + this + they"}, "ja": {"s": "写真を見せてもらった。この人は誰か聞く。", "h": "誰＋これ＋その人"}},
 "f07":{"c": "Kumusta na ang imong trabaho?", "en": {"s": "Ask a relative how their work is going.", "h": "ask how + your …"}, "ja": {"s": "親せきに、仕事はどうか聞く。", "h": "様子を聞く＋あなたの〜"}},
 "f08":{"c": "Pila mo ka magsuon?", "en": {"s": "Ask how many siblings they have.", "h": "how many + you all + ka + noun"}, "ja": {"s": "何人きょうだいか聞く。", "h": "いくつ＋あなたたち＋ka＋名詞"}},
 "p01":{"c": "Madungog ba ko nimo?", "en": {"s": "You're on a one-on-one video call. Ask if they can hear you.", "h": "can hear + question + me + you"}, "ja": {"s": "1対1のビデオ通話がつながった。声が聞こえるか聞く。", "h": "聞こえる＋疑問＋私＋あなた"}},
 "p02":{"c": "Dili kaayo ko kadungog nimo.", "en": {"s": "Say you can't hear them well.", "h": "not + very + I + hear + you"}, "ja": {"s": "相手の声がよく聞こえないと伝える。", "h": "否定＋あまり＋私＋聞こえる＋あなた"}},
 "p03":{"c": "Hinay ang signal diri.", "en": {"s": "Say the signal is weak where you are.", "h": "state + subject + here"}, "ja": {"s": "こちらの電波が弱いと言う。", "h": "状態＋主語＋ここ"}},
 "p04":{"c": "Dili ko kakita nimo.", "en": {"s": "The screen froze. Say you can't see them.", "h": "not + I + see + you"}, "ja": {"s": "画面が止まって、相手が見えないと伝える。", "h": "否定＋私＋見える＋あなた"}},
 "p05":{"c": "Gimingaw na mi ninyo.", "en": {"s": "On the call, say you and your family miss them.", "h": "miss + already + we + you all"}, "ja": {"s": "電話で、家族みんながあなたたちに会いたがっていると伝える。", "h": "恋しい＋もう＋私たち＋あなたたち"}},
 "p06":{"c": "Unsay inyong gibuhat karon?", "en": {"s": "Ask what everyone is doing right now.", "h": "what + your (all) + verb + now"}, "ja": {"s": "今みんなで何をしているのか聞く。", "h": "何＋あなたたちの＋動詞＋今"}},
 "p07":{"c": "Motawag ko pag-usab ugma.", "en": {"s": "Say you'll call again tomorrow.", "h": "verb + I + again + time"}, "ja": {"s": "また明日電話すると伝える。", "h": "動詞＋私＋もう一度＋時"}},
 "p08":{"c": "Sige, babay sa.", "en": {"s": "End the call. Say bye for now.", "h": "okay + bye + for now"}, "ja": {"s": "通話の終わりに、じゃあまたねと言う。", "h": "じゃあ＋別れのあいさつ＋ひとまず"}},
 "ev01":{"c": "Malipayong adlawng natawhan!", "en": {"s": "It's someone's birthday. Wish them a happy birthday.", "h": "happy + birthday"}, "ja": {"s": "誕生日の人に、お誕生日おめでとうと言う。", "h": "楽しい＋誕生日"}},
 "ev02":{"c": "Unsa may okasyon karon?", "en": {"s": "Everyone is getting ready for something. Ask what the occasion is today.", "h": "what + man + occasion + today"}, "ja": {"s": "みんなが何かの準備をしている。今日は何のお祝いか聞く。", "h": "何＋man＋行事＋今日"}},
 "ev03":{"c": "Lingaw kaayo ang fiesta!", "en": {"s": "Say the fiesta is a lot of fun.", "h": "state + very + subject"}, "ja": {"s": "フィエスタがとても楽しいと言う。", "h": "状態＋とても＋主語"}},
 "ev04":{"c": "Kanus-a ang fiesta diri?", "en": {"s": "Ask when the fiesta is held here.", "h": "when + subject + here"}, "ja": {"s": "ここのフィエスタはいつか聞く。", "h": "いつ＋主語＋ここ"}},
 "ev05":{"c": "Pahalipay sa inyong kasal!", "en": {"s": "Congratulate a couple on their wedding.", "h": "congratulations + sa + your (two) + noun"}, "ja": {"s": "結婚する2人に、結婚おめでとうと言う。", "h": "お祝い＋sa＋あなたたちの＋名詞"}},
 "ev06":{"c": "Kinsa ang moanhi sa party?", "en": {"s": "Ask who is coming to the party.", "h": "who + ang + verb + sa + noun"}, "ja": {"s": "パーティーに誰が来るのか聞く。", "h": "誰＋ang＋動詞＋sa＋名詞"}},
 "ev07":{"c": "Unsa ang atong lutoon para sa Pasko?", "en": {"s": "Ask what you'll all cook for Christmas.", "h": "what + our + verb + for + occasion"}, "ja": {"s": "クリスマスに何を作るのか聞く。", "h": "何＋私たちの＋動詞＋〜のため＋行事"}},
 "ev08":{"c": "Naa koy regalo para nimo.", "en": {"s": "Tell someone you have a present for them.", "h": "there is + my + noun + for + you"}, "ja": {"s": "1人に、プレゼントがあると伝える。", "h": "ある＋私の＋名詞＋〜のため＋あなた"}},
 "ev09":{"c": "Daghang salamat sa regalo!", "en": {"s": "You received a present. Thank them very much.", "h": "many + thanks + sa + noun"}, "ja": {"s": "プレゼントをもらった。どうもありがとうと言う。", "h": "たくさん＋お礼＋sa＋名詞"}},
 "ev10":{"c": "Sayaw ta!", "en": {"s": "The music starts at the party. Invite someone to dance.", "h": "verb + us"}, "ja": {"s": "パーティーで音楽が始まった。一緒に踊ろうと誘う。", "h": "動詞＋私たち"}},
 "he01":{"c": "Gikapoy kaayo ko karon.", "en": {"s": "Say you're very tired today.", "h": "state + very + I + now"}, "ja": {"s": "今日はとても疲れていると言う。", "h": "状態＋とても＋私＋今"}},
 "he02":{"c": "Sakit akong ulo.", "en": {"s": "Say you have a headache.", "h": "hurts + my + body part"}, "ja": {"s": "頭が痛いと言う。", "h": "痛い＋私の＋体の部分"}},
 "he03":{"c": "Murag hilantan ko.", "en": {"s": "Say you think you have a fever.", "h": "seems + state + I"}, "ja": {"s": "熱があるみたいだと言う。", "h": "〜みたい＋状態＋私"}},
 "he04":{"c": "Naa bay tambal diri?", "en": {"s": "Ask if there is any medicine here.", "h": "there is + question + noun + here"}, "ja": {"s": "ここに薬はあるか聞く。", "h": "ある＋疑問＋名詞＋ここ"}},
 "he05":{"c": "Okay ra ko, ayaw kabalaka.", "en": {"s": "Someone worries about you. Say you're fine and they shouldn't worry.", "h": "okay + ra + I, don't + verb"}, "ja": {"s": "心配された。大丈夫だから心配しないでと言う。", "h": "大丈夫＋ra＋私、否定命令＋動詞"}},
 "he06":{"c": "Nalipay kaayo ko karon.", "en": {"s": "Say you're very happy today.", "h": "state + very + I + now"}, "ja": {"s": "今日はとてもうれしいと言う。", "h": "状態＋とても＋私＋今"}},
 "he07":{"c": "Gutom na ko.", "en": {"s": "Say you're hungry.", "h": "state + already + I"}, "ja": {"s": "おなかがすいたと言う。", "h": "状態＋もう＋私"}},
 "he08":{"c": "Giuhaw kaayo ko.", "en": {"s": "Say you're very thirsty.", "h": "state + very + I"}, "ja": {"s": "のどがとても渇いたと言う。", "h": "状態＋とても＋私"}},
 "he09":{"c": "Bugnaw kaayo diri sa gabii.", "en": {"s": "Say it gets very cold here at night.", "h": "state + very + here + sa + time"}, "ja": {"s": "ここは夜とても寒いと言う。", "h": "状態＋とても＋ここ＋sa＋時"}},
 "he10":{"c": "Kumusta na imong pamati karon?", "en": {"s": "Someone was sick yesterday. Ask how they're feeling now.", "h": "ask how + your + feeling + now"}, "ja": {"s": "昨日具合が悪かった人に、今の気分はどうか聞く。", "h": "様子を聞く＋あなたの＋気分＋今"}},
 "ho01":{"c": "Asa man ang CR?", "en": {"s": "Ask where the bathroom is.", "h": "where + man + noun"}, "ja": {"s": "トイレはどこか聞く。", "h": "どこ＋man＋名詞"}},
 "ho02":{"c": "Pwede ko maligo?", "en": {"s": "Ask if you can take a shower.", "h": "can + I + verb"}, "ja": {"s": "シャワーを浴びてもいいか聞く。", "h": "できる＋私＋動詞"}},
 "ho03":{"c": "Unsa ang password sa WiFi?", "en": {"s": "Ask for the WiFi password.", "h": "what + subject + sa + noun"}, "ja": {"s": "Wi-Fi のパスワードを聞く。", "h": "何＋主語＋sa＋名詞"}},
 "ho04":{"c": "Asa ko matulog?", "en": {"s": "Ask where you should sleep.", "h": "where + I + verb"}, "ja": {"s": "自分はどこで寝ればいいか聞く。", "h": "どこ＋私＋動詞"}},
 "ho05":{"c": "Pwede ko mangayo og tubig?", "en": {"s": "Ask if you can have some water.", "h": "can + I + verb + og + noun"}, "ja": {"s": "水をもらってもいいか聞く。", "h": "できる＋私＋動詞＋og＋名詞"}},
 "ho06":{"c": "Asa nako ibutang akong bag?", "en": {"s": "Ask where to put your bag.", "h": "where + by me + verb + my + noun"}, "ja": {"s": "自分のかばんをどこに置けばいいか聞く。", "h": "どこ＋私が＋動詞＋私の＋名詞"}},
 "ho07":{"c": "Pwede ko mag-charge sa akong cellphone?", "en": {"s": "Ask if you can charge your phone.", "h": "can + I + verb + sa + my + noun"}, "ja": {"s": "携帯を充電してもいいか聞く。", "h": "できる＋私＋動詞＋sa＋私の＋名詞"}},
 "ho08":{"c": "Wala nay tubig sa CR.", "en": {"s": "Tell someone there's no more water in the bathroom.", "h": "none + already + noun + sa + place"}, "ja": {"s": "トイレの水がもうないと伝える。", "h": "ない＋もう＋名詞＋sa＋場所"}},
 "ho09":{"c": "Pwede i-on ang electric fan?", "en": {"s": "It's hot. Ask if the fan can be turned on.", "h": "can + verb + subject"}, "ja": {"s": "暑い。扇風機をつけてもいいか聞く。", "h": "できる＋動詞＋主語"}},
 "ho10":{"c": "Asa man nako ilabay ang basura?", "en": {"s": "Ask where to throw away the trash.", "h": "where + man + by me + verb + subject"}, "ja": {"s": "ごみをどこに捨てればいいか聞く。", "h": "どこ＋man＋私が＋動詞＋主語"}},
 "pl01":{"c": "Unsang orasa ta molakaw ugma?", "en": {"s": "Ask what time you're all leaving tomorrow.", "h": "what time + we + verb + time"}, "ja": {"s": "明日は何時に出発するのか聞く。", "h": "何時＋私たち＋動詞＋時"}},
 "pl02":{"c": "Asa ta moadto karon?", "en": {"s": "Ask where you're all going today.", "h": "where + we + verb + today"}, "ja": {"s": "今日はどこへ行くのか聞く。", "h": "どこ＋私たち＋動詞＋今日"}},
 "pl03":{"c": "Mosimba ta ugma sa buntag?", "en": {"s": "Ask if you're all going to Mass tomorrow morning.", "h": "verb + we + time + sa + time of day?"}, "ja": {"s": "明日の朝、みんなでミサに行くのか聞く。", "h": "動詞＋私たち＋時＋sa＋時間帯？"}},
 "pl04":{"c": "Duha ka semana mi diri.", "en": {"s": "Someone asks how long you're staying. Say you and your family are here for two weeks.", "h": "number + ka + unit + we + here"}, "ja": {"s": "どのくらいいるのか聞かれた。家族で2週間いると答える。", "h": "数＋ka＋単位＋私たち＋ここ"}},
 "pl05":{"c": "Unsa may atong buhaton karong hapon?", "en": {"s": "Ask what you're all doing this afternoon.", "h": "what + man + our + verb + time"}, "ja": {"s": "今日の午後は何をするのか聞く。", "h": "何＋man＋私たちの＋動詞＋時"}},
 "pl06":{"c": "Mouli mi sa sunod semana.", "en": {"s": "Say that you and your family go back home next week.", "h": "verb + we + sa + time"}, "ja": {"s": "来週、家族で帰ると伝える。", "h": "動詞＋私たち＋sa＋時"}},
 "pl07":{"c": "Kadiyot lang, palihug.", "en": {"s": "Someone is calling you over. Ask them to wait a moment.", "h": "a moment + only + please"}, "ja": {"s": "呼ばれた。ちょっと待ってほしいと頼む。", "h": "ちょっと＋だけ＋お願い"}},
 "pl08":{"c": "Gabii na kaayo, matulog na ta.", "en": {"s": "It's very late. Say it's time for everyone to sleep.", "h": "state + already + very, verb + already + we"}, "ja": {"s": "夜も遅い。もう寝ようと言う。", "h": "状態＋もう＋とても、動詞＋もう＋私たち"}},
 "pl09":{"c": "Unsa nga adlaw karon?", "en": {"s": "Ask what day it is today.", "h": "what + nga + day + today"}, "ja": {"s": "今日は何曜日か聞く。", "h": "何＋nga＋日＋今日"}},
 "pl10":{"c": "Moabot mi sa alas tres.", "en": {"s": "Tell the family that you and your family will arrive at three o'clock.", "h": "verb + we + sa + clock time"}, "ja": {"s": "家族で3時に着くと伝える。", "h": "動詞＋私たち＋sa＋時刻"}},
 "gr01":{"c": "Maayong buntag sa tanan!", "en": {"s": "Say good morning to everyone.", "h": "greeting + sa + everyone"}, "ja": {"s": "みんなに、おはようと言う。", "h": "あいさつ＋sa＋みんな"}},
 "gr02":{"c": "Dugay na kaayo ta wala magkita.", "en": {"s": "Say it's been a long time since you last saw each other.", "h": "long + already + very + we + not + verb"}, "ja": {"s": "久しぶりに会った。ずいぶん会っていなかったねと言う。", "h": "長い＋もう＋とても＋私たち＋否定＋動詞"}},
 "gr03":{"c": "Salamat sa pagsugat namo sa airport.", "en": {"s": "Thank them for picking you and your family up at the airport.", "h": "thanks + sa + the act of + us + sa + place"}, "ja": {"s": "空港まで家族を迎えに来てくれたお礼を言う。", "h": "お礼＋sa＋〜すること＋私たちを＋sa＋場所"}},
 "gr04":{"c": "Nakaabot na mi!", "en": {"s": "You and your family walk in the door. Say you've arrived.", "h": "verb + already + we"}, "ja": {"s": "家族と一緒に家に入った。着いたよと言う。", "h": "動詞＋もう＋私たち"}},
 "gr05":{"c": "Murag wala ka nausab.", "en": {"s": "Tell someone they haven't changed at all.", "h": "seems + not + you + verb"}, "ja": {"s": "1人に、全然変わっていないねと言う。", "h": "〜みたい＋否定＋あなた＋動詞"}},
 "gr06":{"c": "Kumusta ang inyong adlaw?", "en": {"s": "Ask everyone how their day was.", "h": "ask how + your (all) + day"}, "ja": {"s": "みんなに、今日はどうだったか聞く。", "h": "様子を聞く＋あなたたちの＋日"}},
 "me01":{"c": "Kinsa ang nagluto ani?", "en": {"s": "Ask who cooked this.", "h": "who + ang + verb + this"}, "ja": {"s": "これは誰が作ったのか聞く。", "h": "誰＋ang＋動詞＋これ"}},
 "me02":{"c": "Unsaon pagluto ani?", "en": {"s": "Ask how to cook this dish.", "h": "how + the act of + verb + this"}, "ja": {"s": "この料理はどうやって作るのか聞く。", "h": "どうやって＋〜すること＋動詞＋これ"}},
 "me03":{"c": "Ganahan kaayo ko og lechon.", "en": {"s": "Say you really like lechon.", "h": "like + very + I + og + noun"}, "ja": {"s": "レチョンが大好きだと言う。", "h": "好き＋とても＋私＋og＋名詞"}},
 "me04":{"c": "Gamay ra, palihug.", "en": {"s": "Someone is serving you food. Ask for just a little.", "h": "little + ra + please"}, "ja": {"s": "料理をよそってもらう。少しだけでいいと頼む。", "h": "少し＋ra＋お願い"}},
 "me05":{"c": "Tilawi ni.", "en": {"s": "Hand someone a dish and tell them to taste it.", "h": "verb (command) + this"}, "ja": {"s": "料理を渡して、味見してと言う。", "h": "動詞（命令）＋これ"}},
 "me06":{"c": "Kaon ta!", "en": {"s": "The food is ready. Say let's eat.", "h": "verb + us"}, "ja": {"s": "料理ができた。食べようと言う。", "h": "動詞＋私たち"}},
 "me07":{"c": "Unsa atong panihapon karong gabii?", "en": {"s": "Ask what's for dinner tonight.", "h": "what + our + noun + time"}, "ja": {"s": "今夜の夕食は何か聞く。", "h": "何＋私たちの＋名詞＋時"}},
 "me08":{"c": "Naa pay kan-on?", "en": {"s": "Ask if there's still some rice left.", "h": "there is + still + noun"}, "ja": {"s": "ご飯はまだあるか聞く。", "h": "ある＋まだ＋名詞"}},

    ok:"言えた", okSub:"次は1週間後〜", mid:"詰まった", midSub:"3日後", ng:"言えなかった", ngSub:"明日",
    draft:"確認中", draftNote:"ネイティブの確認と音声の準備中", notStarted:"未学習", today:"今日復習",
    next:d=>{const [,m,dd]=d.split("-").map(Number);return "次回 "+m+"/"+dd},
    play:c=>"音声を再生："+c}
};

const DAILY = 5;
const LS_KEY = "loved-ones-v1";
const PLAY = '<svg viewBox="0 0 16 16" aria-hidden="true"><path d="M4 2.5v11l9-5.5z"/></svg>';
const $ = id => document.getElementById(id);

function ymd(d){return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}
function today(){return ymd(new Date())}
function addDays(n){const d=new Date();d.setDate(d.getDate()+n);return ymd(d)}

/* storage: localStorage only, no account. Progress is per course and shared by both languages. */
function lsLoad(k){try{const r=localStorage.getItem(k);return r?JSON.parse(r):null}catch(e){return null}}
function lsSave(s){try{localStorage.setItem(LS_KEY,JSON.stringify(s))}catch(e){}}
let saved = lsLoad(LS_KEY);
if(!saved||typeof saved!=="object"){
  saved={lang:null,course:null,progress:{}};
  /* carry over progress from the earlier separate English / Japanese pages */
  for(const [k,l] of [["paguli-bisaya-en-v1","en"],["loved-ones-ja-v1","ja"]]){
    const old=lsLoad(k); if(!old||!old.progress) continue;
    for(const [c,p] of Object.entries(old.progress)) if(!saved.progress[c]||Object.keys(p.cards||{}).length>Object.keys(saved.progress[c].cards||{}).length) saved.progress[c]=p;
    if(!saved.course&&old.course){saved.course=old.course;saved.lang=l}
  }
}
if(!saved.progress) saved.progress={};
if(saved.lang!=="en"&&saved.lang!=="ja"){
  let nav="en"; try{nav=(navigator.language||"en").toLowerCase().startsWith("ja")?"ja":"en"}catch(e){}
  saved.lang=nav;
}
function okCourse(){return saved.course&&COURSES[saved.course]&&COURSES[saved.course].langs.includes(saved.lang)}
if(!okCourse()) saved.course=null;
const L=()=>T[saved.lang];

function prog(){
  const k=saved.course; let p=saved.progress[k];
  if(!p||typeof p!=="object") p={cards:{},day:{date:today(),count:0}};
  if(!p.cards) p.cards={};
  if(!p.day||p.day.date!==today()) p.day={date:today(),count:0};
  saved.progress[k]=p; return p;
}
function persist(){lsSave(saved)}

function items(){return COURSES[saved.course].ids.map(id=>S[id])}
function ready(){return items().filter(x=>!x.draft)}
const sc=x=>(x[saved.lang]||x.en).s, hi=x=>(x[saved.lang]||x.en).h;

/* scheduling: same rules as v1 */
function schedule(id,rating){
  const p=prog(); const c={...(p.cards[id]||{interval:0,reps:0})};
  if(rating==="ng"){c.interval=1}
  else if(rating==="mid"){c.interval=3}
  else {c.interval=c.reps>0&&c.last==="ok"?Math.round(Math.max(7,c.interval*2.5)):7}
  c.reps=(c.reps||0)+1; c.last=rating; c.due=addDays(c.interval);
  p.cards[id]=c;
}
/* optional scene filter for practice, remembered per course */
function curCat(){const k=(saved.filter||{})[saved.course]||"";return CATS.some(c=>c[0]===k)?k:""}
function setCat(k){saved.filter=saved.filter||{};saved.filter[saved.course]=k;persist();pick();renderCard()}
function courseCats(){const ids=COURSES[saved.course].ids;return CATS.filter(c=>ids.some(id=>S[id].cat===c[0]&&!S[id].draft))}
function renderFilter(){
  const t=L(), k=curCat();
  $("catLbl").textContent=t.catLabel;
  $("catSel").innerHTML=`<option value="">${t.catAll}</option>`+courseCats().map(c=>`<option value="${c[0]}"${c[0]===k?" selected":""}>${catName(c[0])}</option>`).join("");
  $("catSel").value=k;
}
function queue(){
  const p=prog(), t=today(), k=curCat(), list=ready().filter(x=>!k||x.cat===k);
  const due=list.filter(x=>p.cards[x.id]&&p.cards[x.id].due<=t)
    .sort((a,b)=>p.cards[a.id].due.localeCompare(p.cards[b.id].due));
  const fresh=list.filter(x=>!p.cards[x.id]);
  return due.concat(fresh);
}

const player=new Audio();
function play(src){if(!src)return;try{player.pause();player.src=src;player.currentTime=0;player.play().catch(()=>{})}catch(e){}}

let current=null, hintLevel=0, revealed=false, extra=0, view="practice";
function pick(){const q=queue();current=q[0]||null;hintLevel=0;revealed=false}

function renderStats(){
  const p=prog(), t=today(), list=ready();
  const seen=list.filter(x=>p.cards[x.id]).length;
  const dueN=list.filter(x=>p.cards[x.id]&&p.cards[x.id].due<=t).length;
  const limit=DAILY+extra;
  let dots='';for(let i=0;i<limit;i++)dots+=`<i class="${i<p.day.count?'done':''}"></i>`;
  $("stats").innerHTML=L().stats(Math.min(p.day.count,limit),limit,dueN,seen,list.length)
    .replace("DOTS",`<span class="dots" aria-hidden="true">${dots}</span>`);
}

function renderCard(){
  renderStats();
  const t=L(), p=prog(), el=$("card"), limit=DAILY+extra;
  if(p.day.count>=limit||!current){
    const left=queue().length;
    el.className="card done-box";
    el.innerHTML = !current
      ? (curCat()
        ? `<h2>${t.catDone}</h2><p class="note">${t.catDoneNote}</p><div class="row" style="justify-content:center"><button class="btn" id="catBack">${t.catBack}</button></div>`
        : `<h2>${t.allDone}</h2><p class="note">${t.allDoneNote}</p>`)
      : `<h2>${t.limitDone(limit)}</h2><p class="note">${t.limitNote}</p>`+
        (left?`<div class="row" style="justify-content:center"><button class="btn" id="moreBtn">${t.more}</button></div>`:"");
    const m=$("moreBtn"); if(m) m.onclick=()=>{extra+=5;pick();renderCard()};
    const cb=$("catBack"); if(cb) cb.onclick=()=>{setCat("");renderFilter()};
    return;
  }
  const isNew=!p.cards[current.id];
  const first=current.c.split(/[\s,.!?]+/)[0];
  let hints="";
  if(hintLevel>=1) hints+=`<div class="hint"><span>${t.pattern}</span>${hi(current)}</div>`;
  if(hintLevel>=2) hints+=`<div class="hint"><span>${t.firstWord}</span><span class="first">${first} …</span></div>`;
  el.className="card";
  el.innerHTML=`
    <div class="tag"><span class="pill ${isNew?'new':'rev'}">${isNew?t.isNew:t.isRev}</span></div>
    <p class="scene">${sc(current)}</p>
    <p class="say">${t.say}</p>
    ${hints?`<div class="hints">${hints}</div>`:""}
    ${revealed?`
    <div class="answer">
      <p class="ceb" lang="ceb">${current.c}</p>
      <div class="row"><button class="btn play" id="playBtn">${PLAY}${t.again}</button></div>
      <div class="reps" id="reps">${t.reps}
        <button aria-label="${t.rep[0]}">1</button><button aria-label="${t.rep[1]}">2</button><button aria-label="${t.rep[2]}">3</button></div>
      <div class="rate">
        <button class="r-ok" data-r="ok">${t.ok}<small>${t.okSub}</small></button>
        <button class="r-mid" data-r="mid">${t.mid}<small>${t.midSub}</small></button>
        <button class="r-ng" data-r="ng">${t.ng}<small>${t.ngSub}</small></button>
      </div>
    </div>`:`
    <div class="row">
      <button class="btn" id="hintBtn" ${hintLevel>=2?"disabled":""}>${hintLevel===0?t.hint0:hintLevel===1?t.hint1:t.hint2}</button>
      <button class="btn primary" id="revealBtn">${t.reveal}</button>
    </div>`}`;
  if(!revealed){
    $("hintBtn").onclick=()=>{hintLevel++;renderCard()};
    $("revealBtn").onclick=()=>{revealed=true;renderCard();play(current.audio)};
  }else{
    $("playBtn").onclick=()=>play(current.audio);
    document.querySelectorAll("#reps button").forEach(b=>b.onclick=()=>b.classList.toggle("on"));
    el.querySelectorAll(".rate button").forEach(b=>b.onclick=()=>{
      schedule(current.id,b.dataset.r); prog().day.count++; persist(); pick(); renderCard();
    });
  }
}

function renderList(){
  const t=L(), p=prog(), td=today();
  const row=x=>{
    const c=p.cards[x.id];
    const st=x.draft?`<span class="pill draft">${t.draft}</span>${t.draftNote}`
      :!c?t.notStarted:c.due<=td?t.today:t.next(c.due);
    return `<div class="item">
      <div class="t"><p class="s">${sc(x)}</p><p class="c" lang="ceb">${x.c}</p><p class="st">${st}</p></div>
      ${x.draft?"":`<button class="icon-btn" data-a="${x.audio}" aria-label="${t.play(x.c)}">${PLAY}</button>`}</div>`;
  };
  const its=items();
  $("list").innerHTML=CATS.map(([k])=>{
    const g=its.filter(x=>x.cat===k); if(!g.length) return "";
    return `<div class="cat-h"><span>${catName(k)}</span><span>${g.length}</span></div>`+g.map(row).join("");
  }).join("")+its.filter(x=>!x.cat).map(row).join("");
  document.querySelectorAll("#list .icon-btn").forEach(b=>b.onclick=()=>play(b.dataset.a));
}

function renderPicker(){
  const t=L();
  $("courses").innerHTML=Object.entries(COURSES).filter(([,c])=>c.langs.includes(saved.lang)).map(([k,c])=>{
    const n=c.ids.filter(id=>!S[id].draft).length;
    return `<button class="course${saved.course===k?' current':''}" data-k="${k}">
      <b>${c.name[saved.lang]}</b><span class="who" lang="ceb">${c.who}</span>
      <p>${c.blurb[saved.lang]}</p><p>${t.ready(n,c.ids.length-n)}</p></button>`;
  }).join("");
  document.querySelectorAll(".course").forEach(b=>b.onclick=()=>{
    saved.course=b.dataset.k; persist(); extra=0; pick(); show("practice");
  });
}

function show(v){
  const t=L();
  if(!saved.course) v="picker";
  view=v;
  document.documentElement.lang=saved.lang;
  document.title=t.app;
  $("appName").firstChild.nodeValue=t.app;
  $("langEn").setAttribute("aria-pressed",String(saved.lang==="en"));
  $("langJa").setAttribute("aria-pressed",String(saved.lang==="ja"));
  $("langNav").setAttribute("aria-label",saved.lang==="ja"?"言語":"Language");
  $("nav").setAttribute("aria-label",saved.lang==="ja"?"表示切り替え":"Views");
  $("tabPractice").textContent=t.practice; $("tabList").textContent=t.list;
  $("pickTitle").textContent=t.pickTitle; $("pickNote").textContent=t.pickNote;
  $("footNote").textContent=t.foot; $("changeBtn").textContent=t.change; $("resetBtn").textContent=t.reset;
  $("picker").hidden=v!=="picker";
  $("practice").hidden=v!=="practice";
  $("listView").hidden=v!=="list";
  $("nav").hidden=v==="picker";
  $("changeBtn").hidden=v==="picker";
  $("resetBtn").hidden=v==="picker";
  $("tabPractice").setAttribute("aria-pressed",String(v==="practice"));
  $("tabList").setAttribute("aria-pressed",String(v==="list"));
  $("courseName").textContent=saved.course&&v!=="picker"?COURSES[saved.course].name[saved.lang]:t.tagline;
  if(v==="picker") renderPicker();
  if(v==="practice"){renderFilter();renderCard()}
  if(v==="list") renderList();
}
function setLang(l){
  if(saved.lang===l) return;
  saved.lang=l;
  if(!okCourse()) saved.course=null;   /* e.g. the Lola/Lolo course has no Japanese edition */
  persist(); show(view);
}
$("langEn").onclick=()=>setLang("en");
$("langJa").onclick=()=>setLang("ja");
$("catSel").onchange=e=>setCat(e.target.value);
$("tabPractice").onclick=()=>show("practice");
$("tabList").onclick=()=>show("list");
$("changeBtn").onclick=()=>show("picker");

let resetArmed=false;
$("resetBtn").onclick=e=>{
  const t=L();
  if(!resetArmed){resetArmed=true;e.target.textContent=t.resetConfirm;setTimeout(()=>{resetArmed=false;e.target.textContent=L().reset},4000);return}
  resetArmed=false;e.target.textContent=t.reset;
  saved.progress[saved.course]={cards:{},day:{date:today(),count:0}};extra=0;persist();pick();
  show(view);
};

if(saved.course) pick();
persist();
show(saved.course?"practice":"picker");
</script>
